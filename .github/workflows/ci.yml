name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci is deterministic — uses package-lock.json exactly,
      # fails if lock file is out of sync with package.json.
      # Never use npm install in CI.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      # Verifies the production bundle compiles without errors.
      # Vite can succeed even when tsc catches type errors if noEmit
      # is not enforced during build — this step catches that gap.
      - name: Build
        run: npm run build