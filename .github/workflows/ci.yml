name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Unit tests · Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Runs tests and enforces thresholds defined in vite.config.ts
      # (lines, functions, branches, statements >= 70%).
      # CI fails if coverage drops below threshold.
      - run: npm run test:coverage

  build:
    name: Build · Bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build

      # Fails CI if the main JS bundle exceeds 350 KB (uncompressed).
      # Current size: ~314 KB. Gives headroom for growth while catching
      # accidental large imports before they reach production.
      - name: Check bundle size
        run: |
          BUNDLE_SIZE=$(find build/assets -name "*.js" | xargs wc -c | tail -1 | awk '{print $1}')
          LIMIT=358400
          echo "Bundle size: ${BUNDLE_SIZE} bytes (limit: ${LIMIT} bytes)"
          if [ "$BUNDLE_SIZE" -gt "$LIMIT" ]; then
            echo "❌ Bundle size ${BUNDLE_SIZE}B exceeds limit of ${LIMIT}B (350KB)"
            exit 1
          fi
          echo "✅ Bundle size OK"